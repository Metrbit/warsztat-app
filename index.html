<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Warsztat</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔧 Warsztat Samochodowy 🔧</h1>

<div class="container">

  <!-- LEWA -->
  <div class="left">
    <h2>Zgłoszenie</h2>
    <input id="name" placeholder="Klient">
    <input id="car" placeholder="Samochód">
    <input id="problem" placeholder="Opis usterki">
    <button onclick="addTask()">Dodaj</button>
  </div>

  <!-- PRAWA -->
  <div class="right">
    <h2>Lista napraw</h2>
    <table>
      <thead>
        <tr>
          <th>Klient</th>
          <th>Samochód</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

</div>


<div id="message" class="message"></div>


<div id="contactSection">

  <h2>Konsultacje</h2>

  <table>
    <thead>
      <tr>
        <th>Klient</th>
        <th>Telefon</th>
        <th>Info</th>
      </tr>
    </thead>
    <tbody id="contactList"></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
