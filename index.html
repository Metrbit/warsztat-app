<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Warsztat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔧 Warsztat Samochodowy 🔧</h1>

<div class="container">

  <div class="left">
    <h2>Zgłoszenie</h2>
    <input id="name" placeholder="Klient">
    <input id="car" placeholder="Samochód">
    <input id="problem" placeholder="Opis usterki">
    <button onclick="addTask()">Dodaj</button>
  </div>

  <div class="right">
    <h2>Lista napraw</h2>
    <table>
      <thead>
        <tr>
          <th>Klient</th>
          <th>Samochód</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

</div>

<div id="message" class="message"></div>

<div id="contactSection">
  <h2>Konsultacje</h2>
  <table>
    <thead>
      <tr>
        <th>Klient</th>
        <th>Telefon</th>
        <th>Info</th>
      </tr>
    </thead>
    <tbody id="contactList"></tbody>
  </table>
</div>

<h2>Dostępne usługi i ceny</h2>
<table>
  <tr><td>Naprawa silnika</td><td>1500 zł</td></tr>
  <tr><td>Wymiana uszczelek</td><td>1500 zł</td></tr>
  <tr><td>Naprawa hamulców</td><td>400 zł</td></tr>
  <tr><td>Naprawa sprzęgła</td><td>700 zł</td></tr>
  <tr><td>Wymiana sprzęgła</td><td>3000 zł</td></tr>
</table>

<script src="script.js"></script>
</body>
</html>
